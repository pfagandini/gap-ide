name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # electron-builder creates the draft release on tags

jobs:
  # Install GAP the way a user would on each OS and run the smoke test
  # (file run, eval, interrupt, PDF and LaTeX export) against the server.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      GAP_WINDOWS_VERSION: "4.16.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install GAP (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gap

      - name: Install GAP (macOS, Homebrew)
        if: runner.os == 'macOS'
        run: brew install gap-system/gap/gap

      - name: Cache GAP installer (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: gap-installer.exe
          key: gap-installer-${{ env.GAP_WINDOWS_VERSION }}

      - name: Install GAP (Windows, official installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path gap-installer.exe)) {
            Invoke-WebRequest -Uri "https://github.com/gap-system/gap/releases/download/v$env:GAP_WINDOWS_VERSION/gap-$env:GAP_WINDOWS_VERSION-x86_64.exe" -OutFile gap-installer.exe
          }
          # Default folder on purpose: the IDE must find GAP where users get it.
          $p = Start-Process -Wait -PassThru -FilePath .\gap-installer.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=$env:RUNNER_TEMP\gap-install.log"
          "installer exit code: $($p.ExitCode)"
          $found = Get-ChildItem -Path "$env:ProgramFiles","$env:LOCALAPPDATA","$env:LOCALAPPDATA\Programs","C:\" -Directory -Filter "GAP*" -ErrorAction SilentlyContinue
          $found | ForEach-Object { $_.FullName; Test-Path (Join-Path $_.FullName "runtime\bin\bash.exe") }
          if (-not ($found | Where-Object { Test-Path (Join-Path $_.FullName "runtime\bin\bash.exe") })) {
            Get-Content "$env:RUNNER_TEMP\gap-install.log" -Tail 60
            throw "GAP was not installed"
          }

      - run: npm ci
      - run: npm run build

      - name: Smoke test
        shell: bash
        env:
          GAP_IDE_PORT: "3001"
          GAP_IDE_READY_TIMEOUT: "300000"
        run: |
          npx tsx server/index.ts --port 3001 > server.log 2>&1 &
          for i in $(seq 120); do curl -fs http://127.0.0.1:3001/api/info > /dev/null && break; sleep 1; done
          curl -s http://127.0.0.1:3001/api/info; echo
          node scripts/smoke.mjs || { cat server.log; exit 1; }

  # Installers. Built for version tags (draft GitHub release) and on demand.
  package:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:electron
      - name: Package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # unsigned builds
        run: npx electron-builder --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
      - uses: actions/upload-artifact@v4
        with:
          name: gap-ide-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
          if-no-files-found: error
